name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        id: setup-java
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: |
          npm install --include=optional
          npm install --no-save @tailwindcss/oxide-linux-x64-gnu 2>/dev/null || true

      - name: Build Web Dist
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://shcvlcrdjcaslqrapudx.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoY3ZsY3JkamNhc2xxcmFwdWR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MDk1NDUsImV4cCI6MjEwNDA4NTU0NX0.YILx2dwA9GtGl2oNsCXHbfgNxid7397fPVjaXFHt_JM' }}
        run: npm run build

      - name: Setup Capacitor Config & Android
        run: |
          npm install --save @capacitor/core @capacitor/cli @capacitor/android
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.tgp.management",
            "appName": "TGP Management",
            "webDir": "dist"
          }
          EOF
          cat << 'EOF' > capacitor.config.ts
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.tgp.management',
            appName: 'TGP Management',
            webDir: 'dist'
          };
          export default config;
          EOF
          npx cap add android
          npx cap sync android

      - name: Accept Android Licenses & Build APK with Java 21
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: |
          export JAVA_HOME="${{ steps.setup-java.outputs.path }}"
          export PATH="$JAVA_HOME/bin:$PATH"
          
          echo "Verified Java Runtime:"
          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/javac" -version
          
          # Force Gradle daemon to use Java 21
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties
          
          # Ensure all subprojects (including :capacitor-android) compile using Java 21
          cat << 'EOF' >> android/build.gradle

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = JavaVersion.VERSION_21
                  targetCompatibility = JavaVersion.VERSION_21
              }
          }
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_21
                              targetCompatibility JavaVersion.VERSION_21
                          }
                      }
                  }
              }
          }
          EOF

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGP-Management-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build Check
        if: steps.check_pkg.outputs.pkg_exists == 'true'
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://shcvlcrdjcaslqrapudx.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoY3ZsY3JkamNhc2xxcmFwdWR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MDk1NDUsImV4cCI6MjEwNDA4NTU0NX0.YILx2dwA9GtGl2oNsCXHbfgNxid7397fPVjaXFHt_JM' }}
        run: npm run build
